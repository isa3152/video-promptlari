<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PromptKutusu – Videodaki prompt’lar tek dokunuşla</title>
<meta name="description" content="Videolarda kullanılan yapay zeka prompt'larını tek dokunuşla kopyala. Portre, orman, neon ve daha fazlası.">
<meta name="theme-color" content="#4a3bff">
<meta property="og:title" content="PromptKutusu – Videodaki prompt'lar tek dokunuşla">
<meta property="og:description" content="Videolarda kullanılan prompt'ları ara, kaydet ve tek dokunuşla kopyala.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">
<style id="css">
:root{
  --bg:#f2f4fb;--surface:#ffffff;--ink:#141838;--muted:#5b6188;--line:#dfe3f3;
  --accent:#4a3bff;--accent-ink:#ffffff;--box:#eceeff;--ok:#0b7a4b;--bad:#c42b3a;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1124;--surface:#171b36;--ink:#eef0ff;--muted:#a3a9d4;--line:#2a2f57;
    --accent:#8f86ff;--accent-ink:#0e1124;--box:#20254a;--ok:#5fe0a5;--bad:#ff7d8a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1124;--surface:#171b36;--ink:#eef0ff;--muted:#a3a9d4;--line:#2a2f57;
  --accent:#8f86ff;--accent-ink:#0e1124;--box:#20254a;--ok:#5fe0a5;--bad:#ff7d8a;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px 40px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(2rem,8vw,3.1rem);line-height:1.02;font-weight:800}
.lead{color:var(--muted);margin:10px 0 22px;max-width:46ch}
.search,.admin input,.admin textarea{width:100%;padding:13px 15px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.search::placeholder,.admin ::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.92rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--muted);font-size:.9rem;margin:12px 0 4px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1.2rem;line-height:1.2;font-weight:600}
.pic{width:100%;max-height:340px;object-fit:cover;border-radius:12px;background:var(--box)}
.meta{display:flex;flex-wrap:wrap;gap:6px;color:var(--muted);font-size:.85rem}
.meta span{background:var(--box);border-radius:8px;padding:2px 9px}
.prompt{margin:0;background:var(--box);border-left:4px solid var(--accent);border-radius:6px 12px 12px 6px;padding:12px 14px;font:.92rem/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:13px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;text-align:center}
.btn.copy{flex:1 1 100%;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:1.02rem}
.btn.copy.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.copy:disabled{opacity:.6}
.btn.half{flex:1 1 0}
.btn.saved{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:9px 12px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:38px 10px}
.empty .btn{margin-top:12px}
.admin{background:var(--surface);border:1.5px dashed var(--accent);border-radius:16px;padding:14px;margin-bottom:20px}
.admin .who{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.admin label{display:block;font-weight:600;font-size:.9rem;margin-top:12px}
.admin label input,.admin label textarea{margin-top:6px;font-weight:400}
.admin .row{display:flex;align-items:center;gap:8px;font-weight:400;margin-top:10px}
.admin .row input{width:auto;margin:0}
.prev{max-width:160px;max-height:160px;border-radius:10px;margin-top:8px;display:block}
.msg{min-height:1.4em;margin:12px 0 4px;font-size:.92rem}
.msg.err{color:var(--bad)}
footer{margin-top:34px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px}
.theme{float:right;font-size:.85rem;padding:6px 12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:system-ui">PromptKutusu: prompt'ları görmek için JavaScript'i etkinleştir.</p></noscript>
<script id="data" type="application/json">{"prompts":[]}</script>
<script id="app">
var HEAD = '<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PromptKutusu – Videodaki prompt’lar tek dokunuşla</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap">';
var $ = function(id){ return document.getElementById(id); };
var D; try { D = JSON.parse($("data").textContent); } catch(e) { D = {prompts:[]}; }
if(!D.prompts) D.prompts = [];
var V = {q:"", cat:"Hepsi", favs:[], admin:false, edit:null, busy:false, delArm:null};
try { V.favs = JSON.parse(localStorage.getItem("pk_favs") || "[]") || []; } catch(e) { V.favs = []; }
function saveFavs(){ try { localStorage.setItem("pk_favs", JSON.stringify(V.favs)); } catch(e) {} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function norm(s){ return String(s).toLocaleLowerCase("tr"); }
function uniq(key){ var o=[]; D.prompts.forEach(function(p){ if(p[key] && o.indexOf(p[key])<0) o.push(p[key]); }); return o; }

/* Sayfanın kendi kaynağını yeniden üretir: yönetici yeni prompt ekleyince bu metin yeni sürüm olarak yayınlanır. */
function buildDoc(state){
  var S = "script";
  var json = JSON.stringify(state).replace(/</g, "\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"tr\"><head>" + HEAD +
    "<style id=\"css\">" + $("css").textContent + "</style></head><body><div id=\"root\"></div>" +
    "<" + S + " id=\"data\" type=\"application/json\">" + json + "</" + S + ">" +
    "<" + S + " id=\"app\">" + $("app").textContent + "</" + S + "></body></html>";
}
async function commit(list){
  if(typeof claude === "undefined") throw {code:"no_artifact"};
  var c = await claude.use("artifact");
  if(!c) throw {code:"no_artifact"};
  await c.publish(buildDoc({prompts:list}));
}

function shell(){
  $("root").innerHTML = '<div class="wrap"><button class="btn theme" id="theme" type="button">Tema</button>' +
    '<h1>PromptKutusu</h1><p class="lead">Videomda kullandığım prompt’ları buradan kopyala, kendi çalışmanda dene.</p>' +
    '<div id="admin"></div>' +
    '<input class="search" id="q" type="search" placeholder="Prompt ara: portre, orman, neon…" aria-label="Prompt ara" autocomplete="off">' +
    '<div class="chips" id="chips" role="group" aria-label="Kategoriler"></div>' +
    '<p class="count" id="count" aria-live="polite"></p><div class="grid" id="grid"></div>' +
    '<footer>İpucu: Prompt’u videodaki araç ve ayarlarla birlikte kullanırsan sonuç videoya daha yakın çıkar. Yeni prompt’lar için kanalı takip et.</footer></div>';
}

function renderChips(){
  var list = ["Hepsi","Kaydedilenler"].concat(uniq("cat"));
  $("chips").innerHTML = list.map(function(c){
    return '<button type="button" class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(V.cat===c)+'">'+esc(c)+'</button>';
  }).join("");
}
function visible(){
  var q = norm(V.q.trim());
  return D.prompts.filter(function(p){
    if(V.cat === "Kaydedilenler" && V.favs.indexOf(p.id) < 0) return false;
    if(V.cat !== "Hepsi" && V.cat !== "Kaydedilenler" && p.cat !== V.cat) return false;
    return !q || norm(p.title+" "+p.text+" "+(p.tool||"")+" "+p.cat).indexOf(q) >= 0;
  });
}
function renderCards(){
  var list = visible();
  $("count").textContent = list.length + " prompt";
  if(!list.length){
    var t = !D.prompts.length ? (V.admin ? "Henüz prompt yok. Yukarıdan ilk prompt’unu ekle." : "Prompt’lar çok yakında burada olacak.")
      : (V.cat === "Kaydedilenler" ? "Henüz prompt kaydetmedin. Kartlardaki Kaydet butonuna dokun." : "Bu aramayla prompt bulunamadı.");
    $("grid").innerHTML = '<div class="empty" style="grid-column:1/-1"><p>'+t+'</p>' +
      (D.prompts.length ? '<button type="button" class="btn" data-reset="1">Filtreleri temizle</button>' : '') + '</div>';
    return;
  }
  $("grid").innerHTML = list.map(function(p){
    var saved = V.favs.indexOf(p.id) >= 0;
    return '<article class="card">' +
      (p.img ? '<img class="pic" loading="lazy" alt="'+esc(p.title)+'" src="/_blob/'+esc(p.img)+'">' : '') +
      '<h2>'+esc(p.title)+'</h2>' +
      '<div class="meta"><span>'+esc(p.cat)+'</span>'+(p.tool?'<span>'+esc(p.tool)+'</span>':'')+'</div>' +
      '<pre class="prompt" id="t-'+esc(p.id)+'">'+esc(p.text)+'</pre>' +
      '<div class="actions">' +
        '<button type="button" class="btn copy" data-copy="'+esc(p.id)+'">Prompt’u kopyala</button>' +
        '<button type="button" class="btn half'+(saved?' saved':'')+'" data-fav="'+esc(p.id)+'" aria-pressed="'+saved+'">'+(saved?'Kaydedildi':'Kaydet')+'</button>' +
        (p.yt ? '<a class="btn half" target="_blank" rel="noopener" href="https://www.youtube.com/shorts/'+encodeURIComponent(p.yt)+'">Videoyu izle</a>' : '') +
      '</div>' +
      (V.admin ? '<div class="actions"><button type="button" class="btn small half" data-edit="'+esc(p.id)+'">Düzenle</button>' +
        '<button type="button" class="btn small half danger" data-del="'+esc(p.id)+'">'+(V.delArm===p.id?'Emin misin? Sil':'Sil')+'</button></div>' : '') +
      '</article>';
  }).join("");
}

/* ---------- Yönetici paneli (sadece sayfanın sahibine görünür) ---------- */
function renderAdmin(){
  if(!V.admin){ $("admin").innerHTML = ""; return; }
  var opt = function(k){ return uniq(k).map(function(x){ return '<option value="'+esc(x)+'">'; }).join(""); };
  $("admin").innerHTML = '<section class="admin"><p class="who">Yönetici olarak giriş yaptın. Bu bölümü sadece sen görürsün.</p>' +
    '<button type="button" class="btn copy" id="toggle">+ Yeni prompt ekle</button>' +
    '<div id="formbox" hidden>' +
      '<label>Kategori<input id="f-cat" list="dl-cat" placeholder="Listeden seç ya da yeni yaz" autocomplete="off"></label><datalist id="dl-cat">'+opt("cat")+'</datalist>' +
      '<label>Başlık<input id="f-title" placeholder="Örn: Sisli ormanda fener"></label>' +
      '<label>Araç (isteğe bağlı)<input id="f-tool" list="dl-tool" placeholder="Midjourney, Flux, Kling…" autocomplete="off"></label><datalist id="dl-tool">'+opt("tool")+'</datalist>' +
      '<label>Prompt<textarea id="f-text" rows="6" placeholder="Prompt’u buraya yapıştır"></textarea></label>' +
      '<label>Shorts linki veya kodu (isteğe bağlı)<input id="f-yt" placeholder="youtube.com/shorts/..."></label>' +
      '<label>Görsel (isteğe bağlı)<input id="f-img" type="file" accept="image/*"></label>' +
      '<img class="prev" id="f-prev" alt="" hidden>' +
      '<label class="row" id="f-rm-wrap" hidden><input type="checkbox" id="f-rm"> Mevcut görseli kaldır</label>' +
      '<p class="msg" id="f-msg" aria-live="polite"></p>' +
      '<div class="actions"><button type="button" class="btn copy" id="f-save">Ekle</button><button type="button" class="btn" id="f-cancel">Vazgeç</button></div>' +
    '</div></section>';
}
function msg(t, err){ var m = $("f-msg"); if(m){ m.textContent = t; m.className = "msg" + (err ? " err" : ""); } }
function openForm(p){
  V.edit = p ? p.id : null;
  $("formbox").hidden = false; $("toggle").hidden = true;
  $("f-cat").value = p ? p.cat : ""; $("f-title").value = p ? p.title : "";
  $("f-tool").value = p && p.tool ? p.tool : ""; $("f-text").value = p ? p.text : "";
  $("f-yt").value = p && p.yt ? p.yt : ""; $("f-img").value = "";
  $("f-rm").checked = false; $("f-rm-wrap").hidden = !(p && p.img);
  $("f-prev").hidden = !(p && p.img); if(p && p.img) $("f-prev").src = "/_blob/" + p.img;
  $("f-save").textContent = p ? "Değişiklikleri kaydet" : "Ekle"; msg("");
  $("formbox").scrollIntoView({block:"start"});
}
function closeForm(){ V.edit = null; $("formbox").hidden = true; $("toggle").hidden = false; }
function ytCode(s){ s = s.trim(); if(!s) return ""; var m = s.match(/(?:shorts\/|v=|youtu\.be\/)([\w-]{6,})/); return m ? m[1] : s.replace(/[^\w-]/g, ""); }
function shrink(file){
  return new Promise(function(res){
    var im = new Image(), u = URL.createObjectURL(file);
    im.onload = function(){
      var k = Math.min(1, 1200 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(function(b){ URL.revokeObjectURL(u); res(b || file); }, "image/jpeg", 0.85);
    };
    im.onerror = function(){ res(file); };
    im.src = u;
  });
}
function failText(e){
  var c = e && e.code;
  if(c === "not_writer" || c === "not_granted" || c === "no_artifact") return "Kaydetme izni yok. Sayfayı kendi hesabınla, yayınlandığı yerden aç.";
  if(c === "no_assets") return "Görsel yükleme bu görünümde kapalı. Görselsiz kaydetmeyi dene.";
  if(c === "too_large") return "Sayfa çok büyüdü. Görselleri küçültmeyi dene.";
  if(c === "conflict") return "Sayfa başka yerde güncellendi, yenileniyor.";
  return "Kaydedilemedi. Biraz sonra tekrar dene.";
}
async function saveForm(){
  if(V.busy) return;
  var cat = $("f-cat").value.trim(), title = $("f-title").value.trim(), text = $("f-text").value.trim();
  if(!cat || !title || !text){ msg("Kategori, başlık ve prompt boş olamaz.", true); return; }
  V.busy = true; $("f-save").disabled = true;
  try{
    var old = V.edit ? D.prompts.filter(function(p){ return p.id === V.edit; })[0] : null;
    var img = old && old.img ? old.img : "";
    if($("f-rm").checked) img = "";
    var file = $("f-img").files[0];
    if(file){
      msg("Görsel yükleniyor…");
      var as = (typeof claude !== "undefined") ? await claude.use("assets") : null;
      if(!as) throw {code:"no_assets"};
      var r = await as.upload(await shrink(file)); img = r.id;
    }
    var item = {id: old ? old.id : "p" + Date.now().toString(36), title:title, cat:cat, tool:$("f-tool").value.trim(), text:text, yt:ytCode($("f-yt").value), img:img};
    var list = D.prompts.slice();
    if(old) list[list.indexOf(old)] = item; else list.unshift(item);
    msg("Kaydediliyor…");
    await commit(list);
    msg("Kaydedildi, sayfa yenileniyor…");
  }catch(e){ msg(failText(e), true); V.busy = false; $("f-save").disabled = false; }
}
async function removePrompt(id){
  try{ await commit(D.prompts.filter(function(p){ return p.id !== id; })); }
  catch(e){ V.delArm = null; renderCards(); alert(failText(e)); }
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise(function(res, rej){
    try{
      var ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select(); var ok = document.execCommand("copy"); document.body.removeChild(ta);
      ok ? res() : rej();
    }catch(e){ rej(e); }
  });
}
function byId(id){ return D.prompts.filter(function(x){ return x.id === id; })[0]; }

document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;
  var d = t.dataset;
  if(d.cat){ V.cat = d.cat; renderChips(); renderCards(); }
  else if(d.reset){ V.cat = "Hepsi"; V.q = ""; $("q").value = ""; renderChips(); renderCards(); }
  else if(d.fav){ var i = V.favs.indexOf(d.fav); if(i >= 0) V.favs.splice(i,1); else V.favs.push(d.fav); saveFavs(); renderCards(); }
  else if(d.copy){
    var p = byId(d.copy);
    copyText(p.text).then(function(){
      t.textContent = "Kopyalandı"; t.classList.add("done");
      setTimeout(function(){ t.textContent = "Prompt’u kopyala"; t.classList.remove("done"); }, 1800);
    }, function(){
      var r = document.createRange(); r.selectNodeContents($("t-"+p.id)); var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      t.textContent = "Metin seçildi, elle kopyala";
      setTimeout(function(){ t.textContent = "Prompt’u kopyala"; }, 2500);
    });
  }
  else if(d.edit){ openForm(byId(d.edit)); }
  else if(d.del){ if(V.delArm === d.del){ t.disabled = true; removePrompt(d.del); } else { V.delArm = d.del; renderCards(); } }
  else if(t.id === "toggle"){ openForm(null); }
  else if(t.id === "f-cancel"){ closeForm(); }
  else if(t.id === "f-save"){ saveForm(); }
  else if(t.id === "theme"){
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    var dark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  }
});
document.addEventListener("input", function(e){
  if(e.target.id === "q"){ V.q = e.target.value; renderCards(); }
});
document.addEventListener("change", function(e){
  if(e.target.id === "f-img"){
    var f = e.target.files[0], pv = $("f-prev");
    if(f){ pv.src = URL.createObjectURL(f); pv.hidden = false; }
  }
});

shell(); renderChips(); renderCards();
(async function(){
  try{
    if(typeof claude === "undefined") return;
    var u = await claude.use("user");
    if(u && u.isOwner()){ V.admin = true; renderAdmin(); renderCards(); }
  }catch(e){}
})();
</script>
</body>
</html>
